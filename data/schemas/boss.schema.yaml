# PROVISIONAL - structure only, not approved content.
# Bosses gate stages; phases follow learn -> pressure -> climax (GAMEPLAY_DESIGN.md section 9).
schema: boss
version: 1
fields:
  id:       {type: str, required: true, pattern: '^[a-z][a-z0-9_]*$'}
  name:     {type: str, required: true}
  stage_id: {type: str}   # ref: stages
  tags:     {type: list, item: str, default: []}
  phases:
    type: list
    min_length: 1
    item:
      type: dict
      keys:
        hp_threshold: {type: float, min: 0, max: 1}
        ability_ids:  {type: list, item: str, default: []}
  rewards:
    type: dict
    keys:
      trophy_id:       {type: str}
      material_amount: {type: int, min: 0}
example:
  id: example_boss
  name: Example Boss
  stage_id: example_stage
  phases:
    - hp_threshold: 1.0
    - hp_threshold: 0.5
      ability_ids: []
  rewards: {trophy_id: example_trophy}
